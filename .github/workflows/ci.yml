name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  headless-tests:
    name: Neovim 0.12.3 headless tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Neovim 0.12.3
        run: |
          curl -fsSLo /tmp/nvim.tar.gz \
            https://github.com/neovim/neovim/releases/download/v0.12.3/nvim-linux-x86_64.tar.gz
          tar -xzf /tmp/nvim.tar.gz -C /tmp
          echo "/tmp/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Run headless regression tests
        run: bash tests/run_headless.sh
