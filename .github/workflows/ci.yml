name: NeoVim integration

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    # Never expose the private Texttools checkout to untrusted PR code.
    if: github.repository == 'Wet-Senker/kickstart.nvim' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout NeoVim
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Require read-only Texttools access
        env:
          READ_KEY: ${{ secrets.TEXTTOOLS_READ_KEY }}
        run: |
          if [ -z "$READ_KEY" ]; then
            echo '::error::Configure TEXTTOOLS_READ_KEY: a read-only deploy key for Wet-Senker/texttools.'
            exit 1
          fi
      - name: Checkout Texttools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Wet-Senker/texttools
          ref: master
          path: texttools
          ssh-key: ${{ secrets.TEXTTOOLS_READ_KEY }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install Texttools
        working-directory: texttools
        run: uv sync --locked --python 3.11
      - name: Install NeoVim 0.12.3
        run: |
          curl -fsSLo "$RUNNER_TEMP/nvim.tar.gz" https://github.com/neovim/neovim/releases/download/v0.12.3/nvim-linux-x86_64.tar.gz
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Run offline headless tests
        env:
          TEXTTOOLS_ROOT: ${{ github.workspace }}/texttools
        run: bash tests/run_headless.sh
